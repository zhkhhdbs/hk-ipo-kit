name: Publish to PyPI

# Trusted Publishing (OIDC) - no API token is stored anywhere.
# PyPI pending publisher: hk-ipo-kit / zhkhhdbs / hk-ipo-kit / publish.yml / environment blank
# Trigger manually for the first upload (v0.0.2 already has a GitHub release); later releases publish automatically on release.

on:
  release:
    types: published]
  workflow_dispatch:
permissions:
  contents: read  id-token: write

  jobs:
    publish:
        runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                        - uses: actions/setup-python@v5
                                with:
                                          python-version: "3.12"
                                                - name: Build distributions
                                                        run: |
                                                                  python -m pip install --upgrade build
                                                                            python -m build
                                                                                  - name: Publish to PyPI
                                                                                          uses: pypa/gh-action-pypi-publish@release/v1
